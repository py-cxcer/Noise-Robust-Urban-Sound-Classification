sample_rate: 22050
clip_duration_seconds: 4.0
mono: true

length_normalization:
  padding_mode: zero
  training_crop: random
  evaluation_crop: center

# A log-Mel spectrogram compresses the frequency axis to a perceptually motivated
# Mel scale and compresses its power range to make quiet and loud structure easier
# for a model to learn from.
representation: log_mel
log_mel:
  n_fft: 1024
  win_length: 1024
  hop_length: 512
  n_mels: 64
  f_min: 0.0
  f_max: null
  power: 2.0
  top_db: 80.0
  center: true
  pad_mode: reflect
  mel_scale: htk

mfcc:
  n_mfcc: 40

normalization:
  method: per_example_standardization
  epsilon: 1.0e-6
